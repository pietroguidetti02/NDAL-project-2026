# config/exp1.yaml
N: 60  # Lookback window (seconds)
X: 10   # Prediction window (seconds)

# Defining train/test split percentages for capture windows
# Format: [percentage_window_1, percentage_window_2]
# Using ALL CPE pairs and BOTH measurement campaigns to maximize the dataset!
# BEST PRACTICE FOR TIME SERIES: Train on one complete session (Window 1), Test on another (Window 2)
train_test_split:
  A->B:
    train: [80, 80]
    test: [20, 20]
  B->A:
    train: [80, 80]
    test: [20, 20]
  B->C:
    train: [80, 80]
    test: [20, 20]
  C->B:
    train: [80, 80]
    test: [20, 20]
  A->C:
    train: [80, 80]
    test: [20, 20]
  C->A:
    train: [80, 80]
    test: [20, 20]